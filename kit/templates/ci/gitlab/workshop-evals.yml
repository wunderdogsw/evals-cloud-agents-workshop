# Eval gate — GitLab CI. No model and no secrets in CI.
#
# How it works: developers (or their agents) run the suite locally with their own Claude Code or Cursor
# login and commit the recording:
#     cd evals && pnpm eval suites/__SUITE__/suite.ts --record      → suites/__SUITE__/last-run.json
# This job checks that the recording is fresh (no tracked file — cases, rubric, threshold, prompt, feature
# code — changed since it was made), was a real full run, and met the suite's threshold.
#
# Installed at .gitlab/ci/workshop-evals.yml and included from .gitlab-ci.yml:
#   include:
#     - local: .gitlab/ci/workshop-evals.yml
# Protect the default branch with "Pipelines must succeed" and the eval becomes a merge gate.

workshop-evals:
  stage: test
  image: node:22
  variables:
    EVAL_SUITE: "suites/__SUITE__/suite.ts"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
  timeout: 10m
  before_script:
    - corepack enable
    - cd evals && pnpm install --frozen-lockfile=false
  script:
    - pnpm verify "$EVAL_SUITE" --junit "$CI_PROJECT_DIR/eval-gate-junit.xml"
  artifacts:
    when: always
    reports:
      junit: eval-gate-junit.xml
