# Eval gate — GitHub Actions. No model and no secrets in CI.
#
# Developers (or their agents) run the suite locally with their own Claude Code or Cursor login and commit
# the recording:   cd evals && pnpm eval suites/__SUITE__/suite.ts --record   → suites/__SUITE__/last-run.json
# This workflow checks the recording is fresh (no tracked file changed since), a real full run, and over
# the threshold. Make it a merge gate: require the "workshop-evals" check on the default branch.

name: workshop-evals

on:
  pull_request:
  push:
    branches: [__DEFAULT_BRANCH__]

jobs:
  workshop-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - working-directory: evals
        run: pnpm install
      - working-directory: evals
        run: |
          set -o pipefail
          pnpm verify suites/__SUITE__/suite.ts --junit "$RUNNER_TEMP/eval-gate-junit.xml" | tee -a "$GITHUB_STEP_SUMMARY"
